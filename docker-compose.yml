version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: gamification-db
    environment:
      POSTGRES_USER: gamification
      POSTGRES_PASSWORD: gamification_pass
      POSTGRES_DB: gamification_loyalty
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U gamification']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gamification-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: gamification-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gamification-network

  # Backend API (NestJS)
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gamification-backend
    ports:
      - '3000:3000'
    environment:
      DATABASE_URL: postgresql://gamification:gamification_pass@postgres:5432/gamification_loyalty?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3000
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - gamification-network
    restart: unless-stopped

  # Admin UI (Next.js)
  admin:
    build:
      context: .
      dockerfile: admin/Dockerfile
    container_name: gamification-admin
    ports:
      - '3001:3001'
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000
    depends_on:
      - backend
    networks:
      - gamification-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  gamification-network:
    driver: bridge
